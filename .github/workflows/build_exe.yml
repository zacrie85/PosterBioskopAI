name: Build EXE + Model AI

# PosterBioskopAI v2.0 — AI generatif lokal (Stable Diffusion Turbo ONNX)
# - Bisa dijalankan manual: tab Actions -> Build EXE + Model AI -> Run workflow
# - Otomatis saat push tag v* (EXE + bagian model AI ditempel ke release tsb)
# - smoke-test menjalankan pipeline AI dengan MODEL ASLI di runner Linux dan
#   menyimpan contoh poster sebagai artifact (bukti AI benar-benar bekerja)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE (PyInstaller, font ikut dikemas)
        run: |
          python make_icon.py
          pyinstaller --noconfirm --onefile --windowed --name PosterBioskopAI --icon=icon.ico --add-data "assets;assets" poster_app.py

      - name: Simpan EXE sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosterBioskopAI-Windows-EXE
          path: dist/PosterBioskopAI.exe
          if-no-files-found: error

      - name: Tempel EXE ke release (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "PosterBioskopAI $env:GITHUB_REF_NAME" --notes "Poster AI generatif lokal (Stable Diffusion Turbo)."
          }
          gh release upload $env:GITHUB_REF_NAME dist/PosterBioskopAI.exe --clobber --repo $env:GITHUB_REPOSITORY

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow opencv-python-headless numpy regex onnxruntime

      - name: Unduh model AI lewat kode aplikasi (8 file, ~2,5 GB)
        timeout-minutes: 20
        run: |
          python - <<'PY'
          import poster_ai

          state = {"last": ""}
          def prog(fase, got, total):
              if fase != state["last"]:
                  print("mengunduh:", fase)
                  state["last"] = fase

          ok = poster_ai.download_model(progress=prog)
          siap, got, total, folder = poster_ai.model_status()
          print("siap:", siap, "|", got, "/", total, "byte |", folder)
          assert siap, "unduhan model tidak lengkap"
          PY

      - name: Buat video uji sintetis
        run: |
          python - <<'PY'
          import cv2, numpy as np, os
          os.makedirs("video_uji", exist_ok=True)
          W, H = 960, 540
          vw = cv2.VideoWriter("video_uji/VID_20250101_bukit_cahaya_senja.mp4",
                               cv2.VideoWriter_fourcc(*"mp4v"), 25, (W, H))
          for i in range(150):
            t = i / 150
            f = np.zeros((H, W, 3), np.uint8)
            f[:, :, 0] = int(90 + 80 * t)
            f[:, :, 1] = int(60 + 90 * t)
            f[:, :, 2] = int(30 + 120 * t)
            cv2.circle(f, (int(W * (0.2 + 0.6 * t)), int(H * 0.45)), 70, (40, 60, 200), -1)
            cv2.rectangle(f, (int(W * 0.6), int(H * 0.7)), (int(W * 0.85), int(H * 0.9)), (10, 10, 40), -1)
            vw.write(f)
          vw.release()
          print("video uji siap")
          PY

      - name: Jalankan pipeline AI (batch, rasio 9:16)
        timeout-minutes: 25
        run: python batch_poster.py video_uji --out hasil_ai --rasio "9:16" --kualitas "Cepat (1 langkah)"

      - name: Simpan contoh poster AI sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: contoh-poster-AI-asli
          path: |
            hasil_ai/*.png
            video_uji/VID_20250101_bukit_cahaya_senja.mp4
          if-no-files-found: error

  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependensi minimal (untuk pengunduh model)
        run: python -m pip install --quiet pillow numpy

      - name: Unduh model AI lewat kode aplikasi (8 file, ~2,5 GB)
        timeout-minutes: 20
        run: |
          python - <<'PY'
          import poster_ai

          state = {"last": ""}
          def prog(fase, got, total):
              if fase != state["last"]:
                  print("mengunduh:", fase)
                  state["last"] = fase

          ok = poster_ai.download_model(progress=prog)
          siap, got, total, folder = poster_ai.model_status()
          print("siap:", siap, "|", got, "/", total, "byte |", folder)
          assert siap, "unduhan model tidak lengkap"
          PY

      - name: Kemas zip & pecah jadi bagian <2 GB (batas GitHub release)
        timeout-minutes: 15
        run: |
          zip -qr PosterBioskopAI-Model-AI.zip models
          split -b 1900m -d PosterBioskopAI-Model-AI.zip PosterBioskopAI-Model-AI.zip.part
          ls -la PosterBioskopAI-Model-AI.zip.part*

      - name: Simpan bagian model sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Model-AI-parts
          path: PosterBioskopAI-Model-AI.zip.part*
          if-no-files-found: error
          retention-days: 7

      - name: Tempel bagian model + catatan rilis (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          AUTH="Authorization: Bearer $GH_TOKEN"
          API="https://api.github.com/repos/$REPO"
          get_id() {
            curl -s -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty'
          }
          rel_id=$(get_id)
          if [ -z "$rel_id" ]; then
            echo "Release belum ada, membuat..."
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"PosterBioskopAI $TAG\",\"body\":\"Poster AI generatif lokal (Stable Diffusion Turbo).\"}" \
              "$API/releases" > /tmp/rel.json
            rel_id=$(jq -r '.id // empty' /tmp/rel.json)
            if [ -z "$rel_id" ]; then
              echo "Kemungkinan balapan dengan job lain, ambil ulang ID..."
              sleep 5
              rel_id=$(get_id)
            fi
          fi
          test -n "$rel_id"
          echo "Release ID: $rel_id"

          body="PosterBioskopAI v2.0 — pembuat poster film dengan AI generatif yang berjalan 100% offline (Stable Diffusion Turbo, ONNX).

          ## Paket unduhan
          - **PosterBioskopAI.exe** — aplikasi utama (Windows 10/11 64-bit)
          - **PosterBioskopAI-Model-AI.zip.part00 & part01** — model AI (±2,5 GB), wajib untuk mode AI penuh
          - **GABUNG-MODEL.bat** — penggabung & pemasang model otomatis

          ## Cara pasang (sekali saja)
          1. Unduh EXE, kedua bagian model, dan GABUNG-MODEL.bat ke SATU folder.
          2. Double-click GABUNG-MODEL.bat — model terpasang otomatis di folder models\\sd-turbo-onnx.
          3. Double-click PosterBioskopAI.exe — status Model AI: SIAP, tanpa internet.

          ## Baru di v2.0
          - Mesin AI generatif Stable Diffusion Turbo (fp16) menggantikan 999 referensi gaya — key art benar-benar digambar AI sesuai prompt.
          - Prompt default sinematik Hollywood + prompt manual yang bisa diterapkan ke semua video dengan satu tombol.
          - Rasio 9:16 (Reels/TikTok/Story), 16:9, atau ikuti rasio video.
          - Tipografi aman: judul dijamin tidak melewati batas kiri-kanan poster."
          jq -n --arg body "$body" '{body: $body}' > /tmp/notes.json
          curl -s -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
            -d @/tmp/notes.json "$API/releases/$rel_id" > /dev/null
          echo "Catatan rilis diperbarui."

          for f in PosterBioskopAI-Model-AI.zip.part* GABUNG-MODEL.bat; do
            name=$(basename "$f")
            size=$(stat -c%s "$f")
            old=$(curl -s -H "$AUTH" "$API/releases/$rel_id/assets?per_page=100" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id' | head -1)
            if [ -n "$old" ]; then
              echo "Hapus aset lama: $name (id $old)"
              curl -s -X DELETE -H "$AUTH" "$API/releases/assets/$old" > /dev/null
            fi
            echo "Upload $name ($size byte)..."
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              -T "$f" \
              "$API/releases/$rel_id/assets?name=$name" > /tmp/up.json
            jq -e --arg n "$name" --argjson s "$size" '.name==$n and .size==$s' /tmp/up.json > /dev/null \
              || { echo "GAGAL upload $name:"; cat /tmp/up.json; exit 1; }
            echo "  OK: $name"
          done
          echo "Semua bagian model + GABUNG-MODEL.bat sudah ada di release."
