name: Build EXE + Model AI

# PosterBioskopAI v2.0 — AI generatif lokal (Stable Diffusion Turbo ONNX)
# - Bisa dijalankan manual: tab Actions -> Build EXE + Model AI -> Run workflow
# - Otomatis saat push tag v* (EXE + bagian model AI ditempel ke release tsb)
# - smoke-test menjalankan pipeline AI dengan MODEL ASLI di runner Linux dan
#   menyimpan contoh poster sebagai artifact (bukti AI benar-benar bekerja)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE (PyInstaller ONEDIR, font ikut dikemas)
        run: |
          python make_icon.py
          pyinstaller --noconfirm --onedir --windowed --name PosterBioskopAI --icon=icon.ico --add-data "assets;assets" --collect-all onnxruntime poster_app.py

      - name: Uji mesin AI di Windows asli (OrtProbe — titik crash pengguna)
        run: |
          pyinstaller --noconfirm --onedir --name OrtProbe --collect-all onnxruntime ort_probe.py
          dist\OrtProbe\OrtProbe.exe
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime gagal dimuat di bundel PyInstaller Windows — rilis diblokir!" }
          Write-Host "OrtProbe LULUS: pyd onnxruntime termuat mulus di Windows."

      - name: Pastikan runtime C++ terbaru ikut di folder aplikasi
        run: |
          $dst = "dist\PosterBioskopAI"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "C:\Windows\System32\$dll" $dst -Force
            Write-Host ("runtime {0} = {1}" -f $dll, (Get-Item (Join-Path $dst $dll)).VersionInfo.FileVersion)
          }

      - name: Kemas folder aplikasi jadi ZIP + unduh VC++ Redistributable
        run: |
          Compress-Archive -Path dist\PosterBioskopAI -DestinationPath dist\PosterBioskopAI-Windows.zip -Force
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile dist\vc_redist.x64.exe
          Get-ChildItem dist | Select-Object Name, Length

      - name: Simpan paket sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosterBioskopAI-Windows
          path: |
            dist/PosterBioskopAI-Windows.zip
            dist/vc_redist.x64.exe
          if-no-files-found: error

      - name: Tempel paket ke release (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "PosterBioskopAI $env:GITHUB_REF_NAME" --notes "Poster AI generatif lokal (Stable Diffusion Turbo)."
          }
          gh release upload $env:GITHUB_REF_NAME dist/PosterBioskopAI-Windows.zip dist/vc_redist.x64.exe --clobber --repo $env:GITHUB_REPOSITORY

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow==11.3.0 opencv-python-headless==4.13.0.90 numpy==2.1.3 regex==2026.4.4 onnxruntime==1.32.0

      - name: Unduh model AI lewat kode aplikasi (8 file, ~2,5 GB)
        timeout-minutes: 20
        run: |
          python - <<'PY'
          import poster_ai

          state = {"last": ""}
          def prog(fase, got, total):
              if fase != state["last"]:
                  print("mengunduh:", fase)
                  state["last"] = fase

          ok = poster_ai.download_model(progress=prog)
          siap, got, total, folder = poster_ai.model_status()
          print("siap:", siap, "|", got, "/", total, "byte |", folder)
          assert siap, "unduhan model tidak lengkap"
          PY

      - name: Probe deklarasi input sesi ONNX (referensi dtype permanen)
        run: |
          python - <<'PY'
          import poster_ai
          ai = poster_ai.PosterAI(keep_loaded=True)
          for name in ("text_encoder", "vae_encoder", "unet", "vae_decoder"):
              s = ai._session(name)
              print(name, "->", [(i.name, i.type) for i in s.get_inputs()])
          PY

      - name: Buat video uji sintetis
        run: |
          python - <<'PY'
          import cv2, numpy as np, os
          os.makedirs("video_uji", exist_ok=True)
          W, H = 960, 540
          vw = cv2.VideoWriter("video_uji/VID_20250101_bukit_cahaya_senja.mp4",
                               cv2.VideoWriter_fourcc(*"mp4v"), 25, (W, H))
          for i in range(150):
            t = i / 150
            f = np.zeros((H, W, 3), np.uint8)
            f[:, :, 0] = int(90 + 80 * t)
            f[:, :, 1] = int(60 + 90 * t)
            f[:, :, 2] = int(30 + 120 * t)
            cv2.circle(f, (int(W * (0.2 + 0.6 * t)), int(H * 0.45)), 70, (40, 60, 200), -1)
            cv2.rectangle(f, (int(W * 0.6), int(H * 0.7)), (int(W * 0.85), int(H * 0.9)), (10, 10, 40), -1)
            vw.write(f)
          vw.release()
          print("video uji siap")
          PY

      - name: Jalankan pipeline AI (batch, rasio 9:16)
        timeout-minutes: 25
        run: python batch_poster.py video_uji --out hasil_ai --rasio "9:16" --kualitas "Cepat (1 langkah)"

      - name: Simpan contoh poster AI sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: contoh-poster-AI-asli
          path: |
            hasil_ai/*.png
            video_uji/VID_20250101_bukit_cahaya_senja.mp4
          if-no-files-found: error

  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependensi minimal (untuk pengunduh model)
        run: python -m pip install --quiet pillow==11.3.0 numpy==2.1.3

      - name: Unduh model AI lewat kode aplikasi (8 file, ~2,5 GB)
        timeout-minutes: 20
        run: |
          python - <<'PY'
          import poster_ai

          state = {"last": ""}
          def prog(fase, got, total):
              if fase != state["last"]:
                  print("mengunduh:", fase)
                  state["last"] = fase

          ok = poster_ai.download_model(progress=prog)
          siap, got, total, folder = poster_ai.model_status()
          print("siap:", siap, "|", got, "/", total, "byte |", folder)
          assert siap, "unduhan model tidak lengkap"
          PY

      - name: Kemas zip & pecah jadi bagian <2 GB (batas GitHub release)
        timeout-minutes: 15
        run: |
          zip -qr PosterBioskopAI-Model-AI.zip models
          split -b 1900m -d PosterBioskopAI-Model-AI.zip PosterBioskopAI-Model-AI.zip.part
          ls -la PosterBioskopAI-Model-AI.zip.part*

      - name: Simpan bagian model sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Model-AI-parts
          path: PosterBioskopAI-Model-AI.zip.part*
          if-no-files-found: error
          retention-days: 7

      - name: Tempel bagian model + catatan rilis (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          AUTH="Authorization: Bearer $GH_TOKEN"
          API="https://api.github.com/repos/$REPO"
          UP="https://uploads.github.com/repos/$REPO"
          get_id() {
            curl -s -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty'
          }
          rel_id=$(get_id)
          if [ -z "$rel_id" ]; then
            echo "Release belum ada, membuat..."
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"PosterBioskopAI $TAG\",\"body\":\"Poster AI generatif lokal (Stable Diffusion Turbo).\"}" \
              "$API/releases" > /tmp/rel.json
            rel_id=$(jq -r '.id // empty' /tmp/rel.json)
            if [ -z "$rel_id" ]; then
              echo "Kemungkinan balapan dengan job lain, ambil ulang ID..."
              sleep 5
              rel_id=$(get_id)
            fi
          fi
          test -n "$rel_id"
          echo "Release ID: $rel_id"

          body="PosterBioskopAI v2.0.5 — pembuat poster film dengan AI generatif yang berjalan 100% offline (Stable Diffusion Turbo, ONNX).

          ## Paket unduhan
          - **PosterBioskopAI-Windows.zip** — aplikasi utama (Windows 10/11 64-bit); ekstrak dulu, di dalamnya ada PosterBioskopAI.exe
          - **PosterBioskopAI-Model-AI.zip.part00 & part01** — model AI (±2,5 GB), wajib untuk mode AI penuh
          - **GABUNG-MODEL.bat** — penggabung & pemasang model otomatis
          - **vc_redist.x64.exe** — pembaruan runtime resmi Microsoft; jalankan HANYA jika muncul pesan tentang mesin AI/runtime

          ## Cara pasang (sekali saja)
          1. Ekstrak PosterBioskopAI-Windows.zip → ada folder PosterBioskopAI berisi aplikasi.
          2. Unduh kedua bagian model + GABUNG-MODEL.bat, taruh DI DALAM folder PosterBioskopAI (di samping PosterBioskopAI.exe).
          3. Double-click GABUNG-MODEL.bat — model terpasang di models\\sd-turbo-onnx di dalam folder aplikasi.
          4. Double-click PosterBioskopAI.exe — status Model AI: SIAP, tanpa internet.

          ## Baru di v2.0.5 (perbaikan kualitas AI yang sesungguhnya)
          - Bug penting: preset kualitas lama dengan strength di bawah 1.0 ternyata melompati SEMUA langkah UNet — hasilnya hanya round-trip VAE (frame yang dihaluskan), bukan gambar AI.
          - Kini semua preset benar-benar menggambar dengan UNet: Cepat = 1 langkah, Normal = 2, Tinggi = 3, Maksimal = 4 (gambar ulang penuh ala SD-Turbo), pengaman minimal 1 langkah, jumlah langkah selalu persis sesuai label.

          ## Baru di v2.0.4 (perbaikan InvalidArgument saat AI menggambar)
          - Feed model AI dikonversi otomatis ke tipe yang dideklarasikan sesi ONNX (float/fp16/int64/int32).
          - Bila kernel ORT di CPU tertentu tetap menuntut tipe lain (kasus timestep int64 vs float), galat diparse dan dicoba ulang otomatis dengan tipe yang diminta.
          - Sesi yang tetap gagal melaporkan nama sesi + tipe semua feed ke log (diagnostik lebih jelas).
          - CI mencatat deklarasi input tiap sesi ONNX sebagai referensi dtype permanen.

          ## Baru di v2.0.3 (perbaikan tampilan pesan galat)
          - Memperbaiki NameError saat menampilkan jendela pesan galat (variabel target except dihapus Python saat blok berakhir).
          - Galat ASLI penyebab render gagal kini selalu terekam utuh di log_kesalahan.txt sejak thread kerja — bukan hanya tampil sekilas di jendela.

          ## Baru di v2.0.2 (perbaikan akar masalah crash saat membuat poster)
          - Aplikasi dibangun mode ONEDIR menggantikan onefile — menghilangkan konflik pemuatan DLL penyebab access violation saat memuat mesin AI.
          - Runtime C++ terbaru (msvcp140/vcruntime140/vcruntime140_1) dijamin ikut di folder aplikasi.
          - DLL mesin AI dimuat eksplisit sebelum dipakai; mesin AI diperiksa saat aplikasi dibuka (masalah terlihat dengan pesan jelas, bukan menutup diam-diam).
          - OrtProbe: build otomatis menguji pemuatan mesin AI di Windows asli — versi yang gagal tidak akan pernah dirilis.

          ## Baru di v2.0.1
          - Perbaikan stabilitas: setiap kesalahan kini tampil sebagai pesan dan terekam di log_kesalahan.txt di samping aplikasi — tidak ada lagi aplikasi menutup sendiri tanpa penjelasan.
          - Bundel EXE membawa mesin AI (onnxruntime) lengkap; versi pustaka dipin ke kombinasi yang teruji.

          ## Baru di v2.0
          - Mesin AI generatif Stable Diffusion Turbo (fp16) menggantikan 999 referensi gaya — key art benar-benar digambar AI sesuai prompt.
          - Prompt default sinematik Hollywood + prompt manual yang bisa diterapkan ke semua video dengan satu tombol.
          - Rasio 9:16 (Reels/TikTok/Story), 16:9, atau ikuti rasio video.
          - Tipografi aman: judul dijamin tidak melewati batas kiri-kanan poster."
          jq -n --arg body "$body" '{body: $body}' > /tmp/notes.json
          curl -s -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
            -d @/tmp/notes.json "$API/releases/$rel_id" > /dev/null
          echo "Catatan rilis diperbarui."

          for f in PosterBioskopAI-Model-AI.zip.part* GABUNG-MODEL.bat; do
            name=$(basename "$f")
            size=$(stat -c%s "$f")
            old=$(curl -s -H "$AUTH" "$API/releases/$rel_id/assets?per_page=100" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id' | head -1)
            if [ -n "$old" ]; then
              echo "Hapus aset lama: $name (id $old)"
              curl -s -X DELETE -H "$AUTH" "$API/releases/assets/$old" > /dev/null
            fi
            echo "Upload $name ($size byte)..."
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              -T "$f" \
              "$UP/releases/$rel_id/assets?name=$name" > /tmp/up.json
            jq -e --arg n "$name" --argjson s "$size" '.name==$n and .size==$s' /tmp/up.json > /dev/null \
              || { echo "GAGAL upload $name:"; cat /tmp/up.json; exit 1; }
            echo "  OK: $name"
          done
          echo "Semua bagian model + GABUNG-MODEL.bat sudah ada di release."
